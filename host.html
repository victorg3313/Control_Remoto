<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote Control — Escanea para conectar</title>
<style>
  :root {
    --bg: #0d0d0f; --panel: #1a1a1d; --accent: #4f8dfd;
    --text: #f2f2f2; --muted: #8a8a8f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    display: flex; align-items: center; justify-content: center;
  }
  .card {
    background: var(--panel); border: 1px solid #2a2a2e; border-radius: 20px;
    padding: 36px 40px; text-align: center; max-width: 360px;
  }
  h1 { font-size: 18px; margin: 0 0 4px 0; }
  p.sub { color: var(--muted); font-size: 13px; margin: 0 0 22px 0; }
  img.qr { width: 220px; height: 220px; border-radius: 12px; background: #fff; padding: 10px; }
  .code {
    font-size: 28px; letter-spacing: 6px; font-weight: 700;
    margin: 18px 0 4px 0; color: var(--accent);
  }
  .code-label { font-size: 12px; color: var(--muted); margin-bottom: 20px; }
  #status {
    font-size: 13px; padding: 10px 14px; border-radius: 10px;
    background: #232328; color: var(--muted);
  }
  #status.connected { color: #4fd97b; }
</style>
</head>
<body>
  <div class="card">
    <h1>📱 Escanea con tu iPhone</h1>
    <p class="sub">Debe estar en la cámara o cualquier lector de QR — no necesita estar en tu misma red WiFi.</p>
    <img class="qr" src="{{ qr_data_uri }}" alt="QR de conexión">
    <div class="code">{{ room_code }}</div>
    <div class="code-label">o entra manualmente a {{ control_url }}</div>
    <div id="status">Esperando que escanees el QR...</div>
  </div>

<script>
async function poll() {
  try {
    const res = await fetch('/api/status/{{ room_code }}');
    const data = await res.json();
    const el = document.getElementById('status');
    if (!data.exists) {
      el.textContent = 'Sesión expirada — reinicia el programa en tu laptop.';
      el.classList.remove('connected');
      return; // dejamos de sondear
    }
    if (data.connected) {
      el.textContent = '✅ iPhone conectado y controlando';
      el.classList.add('connected');
    } else {
      el.textContent = 'Esperando que escanees el QR...';
      el.classList.remove('connected');
    }
  } catch (e) { /* ignorar errores de red pasajeros */ }
  setTimeout(poll, 2000);
}
poll();
</script>
</body>
</html>
