<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Remote Control</title>
<style>
  :root {
    --bg: #0d0d0f;
    --panel: #1a1a1d;
    --accent: #4f8dfd;
    --text: #f2f2f2;
    --muted: #8a8a8f;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overscroll-behavior: none; touch-action: none;
  }
  #status {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 10px 16px env(safe-area-inset-top) 16px;
    padding-top: calc(env(safe-area-inset-top) + 8px);
    font-size: 13px; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
    z-index: 10; background: linear-gradient(var(--bg), transparent);
  }
  #dot { width: 8px; height: 8px; border-radius: 50%; background: #e05555; transition: background .2s; }
  #dot.connected { background: #4fd97b; }

  .container {
    display: flex; flex-direction: column; height: 100%;
    padding: 44px 14px 14px 14px;
    padding-bottom: calc(14px + env(safe-area-inset-bottom));
    gap: 12px;
  }

  #touchpad {
    flex: 1;
    background: var(--panel);
    border-radius: 20px;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    font-size: 14px;
    border: 1px solid #2a2a2e;
  }
  #touchpad.active { border-color: var(--accent); }

  .row { display: flex; gap: 10px; }

  button {
    flex: 1;
    background: var(--panel);
    color: var(--text);
    border: 1px solid #2a2a2e;
    border-radius: 14px;
    padding: 16px 0;
    font-size: 20px;
    font-weight: 600;
    display: flex; align-items: center; justify-content: center;
  }
  button:active { background: #26262b; transform: scale(0.96); }
  button.small { font-size: 15px; padding: 12px 0; }
  button.accent { background: var(--accent); color: #fff; }

  #keyboardInput {
    position: absolute; opacity: 0; pointer-events: none;
  }

  .tabs { display: flex; gap: 8px; margin-bottom: 2px; }
  .tab {
    flex: 1; text-align: center; padding: 8px 0;
    border-radius: 10px; font-size: 13px; color: var(--muted);
    background: var(--panel); border: 1px solid #2a2a2e;
  }
  .tab.on { color: #fff; background: #232328; border-color: var(--accent); }

  .panel { display: none; flex-direction: column; gap: 10px; flex: 1; }
  .panel.on { display: flex; }
</style>
</head>
<body>

<div id="status"><div id="dot"></div><span id="statusText">Conectando...</span></div>

<div class="container">

  <div class="tabs">
    <div class="tab on" data-tab="pad">Touchpad</div>
    <div class="tab" data-tab="media">Media</div>
    <div class="tab" data-tab="keys">Teclado</div>
  </div>

  <!-- TOUCHPAD -->
  <div class="panel on" id="panel-pad" style="flex:1">
    <div id="touchpad">Desliza para mover · toca para click</div>
    <div class="row">
      <button class="small" id="btnLeftClick">Click izq</button>
      <button class="small" id="btnRightClick">Click der</button>
    </div>
  </div>

  <!-- MEDIA -->
  <div class="panel" id="panel-media">
    <div class="row">
      <button class="small" data-media="prev_track">⏮</button>
      <button class="accent" data-media="play_pause">⏯</button>
      <button class="small" data-media="next_track">⏭</button>
    </div>
    <div class="row">
      <button class="small" data-media="vol_down">🔉 Vol −</button>
      <button class="small" data-media="mute">🔇</button>
      <button class="small" data-media="vol_up">🔊 Vol +</button>
    </div>
    <div class="row">
      <button class="small" id="btnCloseTab">Cerrar pestaña</button>
      <button class="small" id="btnFullscreen">Fullscreen</button>
    </div>
    <div class="row">
      <button class="small" id="btnAltTab">Alt+Tab</button>
    </div>
  </div>

  <!-- KEYBOARD -->
  <div class="panel" id="panel-keys">
    <button class="accent" id="btnOpenKeyboard">Tocar para escribir</button>
    <input id="keyboardInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="row">
      <button class="small" id="btnEnter">Enter ⏎</button>
      <button class="small" id="btnBackspace">⌫</button>
      <button class="small" id="btnSpace">Espacio</button>
    </div>
    <div class="row">
      <button class="small" id="btnUp">↑</button>
    </div>
    <div class="row">
      <button class="small" id="btnLeft">←</button>
      <button class="small" id="btnDown">↓</button>
      <button class="small" id="btnRight">→</button>
    </div>
    <div class="row">
      <button class="small" id="btnEsc">Esc</button>
      <button class="small" id="btnTab">Tab</button>
    </div>
  </div>

</div>

<script>
const statusText = document.getElementById('statusText');
const dot = document.getElementById('dot');

// El código de sala viene inyectado por el servidor (Jinja2) según la
// URL /control/<room_code> que se abrió al escanear el QR.
const ROOM_CODE = "{{ room_code }}";

let ws;
let wsReady = false;

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws/control/${ROOM_CODE}`);

  ws.onopen = () => {
    statusText.textContent = 'Conectando con la laptop...';
  };

  ws.onmessage = (msg) => {
    let data;
    try { data = JSON.parse(msg.data); } catch { return; }

    if (data.type === 'connected') {
      wsReady = true;
      dot.classList.add('connected');
      statusText.textContent = 'Conectado';
    } else if (data.type === 'error') {
      wsReady = false;
      dot.classList.remove('connected');
      statusText.textContent = data.message || 'Error de conexión';
    }
  };

  ws.onclose = () => {
    wsReady = false;
    dot.classList.remove('connected');
    statusText.textContent = 'Desconectado — reintentando...';
    setTimeout(connect, 1500);
  };
  ws.onerror = () => ws.close();
}
connect();

function send(obj) {
  if (wsReady) ws.send(JSON.stringify(obj));
}

// ---------------- Tabs ----------------
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('on'));
    tab.classList.add('on');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('on');
  });
});

// ---------------- Touchpad ----------------
const pad = document.getElementById('touchpad');
let lastX = 0, lastY = 0;
let touchStartTime = 0;
let moved = false;
let twoFingerScroll = false;
let dragging = false;
let tapTimer = null;
let lastTapTime = 0;

const SENSITIVITY = 1.8;

pad.addEventListener('touchstart', (e) => {
  pad.classList.add('active');
  touchStartTime = Date.now();
  moved = false;

  if (e.touches.length === 2) {
    twoFingerScroll = true;
    lastY = e.touches[0].clientY;
    return;
  }
  twoFingerScroll = false;
  lastX = e.touches[0].clientX;
  lastY = e.touches[0].clientY;
}, { passive: true });

pad.addEventListener('touchmove', (e) => {
  moved = true;

  if (twoFingerScroll && e.touches.length === 2) {
    const y = e.touches[0].clientY;
    const dy = (lastY - y) * 0.5;
    send({ type: 'scroll', dy });
    lastY = y;
    return;
  }

  const x = e.touches[0].clientX;
  const y = e.touches[0].clientY;
  const dx = (x - lastX) * SENSITIVITY;
  const dy = (y - lastY) * SENSITIVITY;
  send({ type: 'move', dx, dy });
  lastX = x;
  lastY = y;
}, { passive: true });

pad.addEventListener('touchend', (e) => {
  pad.classList.remove('active');
  if (dragging) {
    send({ type: 'mouse_up' });
    dragging = false;
    return;
  }
  if (twoFingerScroll) { twoFingerScroll = false; return; }

  if (!moved) {
    const now = Date.now();
    if (now - lastTapTime < 280) {
      // doble tap
      clearTimeout(tapTimer);
      send({ type: 'double_click' });
      lastTapTime = 0;
    } else {
      lastTapTime = now;
      tapTimer = setTimeout(() => send({ type: 'click' }), 220);
    }
  }
}, { passive: true });

// Long press = drag
let longPressTimer = null;
pad.addEventListener('touchstart', () => {
  longPressTimer = setTimeout(() => {
    if (!moved) {
      send({ type: 'mouse_down' });
      dragging = true;
    }
  }, 450);
}, { passive: true });
pad.addEventListener('touchend', () => clearTimeout(longPressTimer), { passive: true });
pad.addEventListener('touchmove', () => clearTimeout(longPressTimer), { passive: true });

document.getElementById('btnLeftClick').addEventListener('click', () => send({ type: 'click' }));
document.getElementById('btnRightClick').addEventListener('click', () => send({ type: 'right_click' }));

// ---------------- Media ----------------
document.querySelectorAll('[data-media]').forEach(btn => {
  btn.addEventListener('click', () => send({ type: 'media', value: btn.dataset.media }));
});
document.getElementById('btnCloseTab').addEventListener('click', () => send({ type: 'combo', value: 'close_tab' }));
document.getElementById('btnFullscreen').addEventListener('click', () => send({ type: 'combo', value: 'fullscreen' }));
document.getElementById('btnAltTab').addEventListener('click', () => send({ type: 'combo', value: 'alt_tab' }));

// ---------------- Keyboard ----------------
const kbInput = document.getElementById('keyboardInput');
document.getElementById('btnOpenKeyboard').addEventListener('click', () => {
  kbInput.value = '';
  kbInput.focus();
});

let lastValue = '';
kbInput.addEventListener('input', () => {
  const val = kbInput.value;
  if (val.length > lastValue.length) {
    // se agregó texto
    const added = val.slice(lastValue.length);
    send({ type: 'text', value: added });
  } else if (val.length < lastValue.length) {
    // backspace
    send({ type: 'key', value: 'backspace' });
  }
  lastValue = val;
  // Reseteamos periódicamente el input para que no crezca infinito
  if (val.length > 200) {
    kbInput.value = '';
    lastValue = '';
  }
});

document.getElementById('btnEnter').addEventListener('click', () => send({ type: 'key', value: 'enter' }));
document.getElementById('btnBackspace').addEventListener('click', () => send({ type: 'key', value: 'backspace' }));
document.getElementById('btnSpace').addEventListener('click', () => send({ type: 'key', value: 'space' }));
document.getElementById('btnEsc').addEventListener('click', () => send({ type: 'key', value: 'escape' }));
document.getElementById('btnTab').addEventListener('click', () => send({ type: 'key', value: 'tab' }));
document.getElementById('btnUp').addEventListener('click', () => send({ type: 'key', value: 'arrow_up' }));
document.getElementById('btnDown').addEventListener('click', () => send({ type: 'key', value: 'arrow_down' }));
document.getElementById('btnLeft').addEventListener('click', () => send({ type: 'key', value: 'arrow_left' }));
document.getElementById('btnRight').addEventListener('click', () => send({ type: 'key', value: 'arrow_right' }));

// Evita que iOS haga zoom con doble tap en toda la página
document.addEventListener('dblclick', (e) => e.preventDefault());
document.addEventListener('gesturestart', (e) => e.preventDefault());
</script>

</body>
</html>
